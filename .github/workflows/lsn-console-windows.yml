name: LSN Console Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'lsn-console-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install Windows platform-native binaries
        shell: bash
        run: |
          # pnpm excludes Windows-only optional deps when the lockfile is built on Linux.
          # Install them from a clean temp dir then copy each package individually,
          # removing any existing pnpm symlink first so cp can write a real directory.
          mkdir -p /tmp/win-bins && cd /tmp/win-bins
          npm init -y
          npm install --no-save --ignore-scripts \
            @rollup/rollup-win32-x64-msvc@4.62.3 \
            @rollup/rollup-win32-x64-gnu@4.62.3 \
            lightningcss-win32-x64-msvc@1.32.0 \
            "@tailwindcss/oxide-win32-x64-msvc@4.3.3" \
            @esbuild/win32-x64@0.27.3
          NM="$GITHUB_WORKSPACE/node_modules"
          mkdir -p "$NM/@rollup" "$NM/@esbuild" "$NM/@tailwindcss"
          for pkg in rollup-win32-x64-msvc rollup-win32-x64-gnu; do
            rm -rf "$NM/@rollup/$pkg"
            cp -rf "node_modules/@rollup/$pkg" "$NM/@rollup/"
          done
          rm -rf "$NM/lightningcss-win32-x64-msvc"
          cp -rf node_modules/lightningcss-win32-x64-msvc "$NM/"
          rm -rf "$NM/@tailwindcss/oxide-win32-x64-msvc"
          cp -rf "node_modules/@tailwindcss/oxide-win32-x64-msvc" "$NM/@tailwindcss/"
          rm -rf "$NM/@esbuild/win32-x64"
          cp -rf "node_modules/@esbuild/win32-x64" "$NM/@esbuild/"
      - run: pnpm --filter @workspace/lsn-engineering-console run lint
      - run: pnpm --filter @workspace/lsn-engineering-console run typecheck
      - run: pnpm --filter @workspace/lsn-engineering-console run test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#lsn-console-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)" >&2
            exit 1
          fi
      - run: pnpm --filter @workspace/lsn-engineering-console run build
        env:
          PORT: 4173
          BASE_PATH: ./
      - run: pnpm --filter @workspace/lsn-engineering-console run make
      - name: Collect and validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          OUT=artifacts/lsn-engineering-console/out/make
          DIST=release-assets
          mkdir -p "$DIST"
          INSTALLER=$(find "$OUT" -name "LSN-Engineering-Console-Setup-${VERSION}-dev.exe" | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "Expected installer LSN-Engineering-Console-Setup-${VERSION}-dev.exe not found" >&2
            find "$OUT" -type f >&2
            exit 1
          fi
          cp "$INSTALLER" "$DIST/"
          PORTABLE=$(find "$OUT" -name "*.zip" | head -n 1)
          if [ -n "$PORTABLE" ]; then
            cp "$PORTABLE" "$DIST/LSN-Engineering-Console-Portable-${VERSION}.zip"
          else
            echo "Expected portable ZIP was not produced." >&2
            find "$OUT" -type f >&2
            exit 1
          fi
          (cd "$DIST" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LSN-Engineering-Console-Windows
          path: release-assets/**
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: LSN Engineering Console ${{ github.ref_name }} (Development Preview)
          body: |
            Unsigned internal Development Preview build of the LSN Engineering Console.

            - Microsoft Defender SmartScreen will warn on first run ("More info" → "Run anyway").
            - Hardware Mode truthfully reports that real WT32-ETH01 discovery, EtherNet/IP (CIP)
              communication, physical validation, and firmware upload are not yet implemented.
            - LSN Protocol, Device Profile, and the LSN-Firmware-Interface-v0.1 package are unchanged (v0.1).

            See `artifacts/lsn-engineering-console/CHANGELOG.md` for the full release entry.
      - name: Verify permanent release asset URLs
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          for ASSET in \
            "LSN-Engineering-Console-Setup-${VERSION}-dev.exe" \
            "LSN-Engineering-Console-Portable-${VERSION}.zip"; do
            URL="${RELEASE_BASE}/${ASSET}"
            echo "Verifying ${URL}"
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-delay 3 --retry-all-errors "${URL}" >/dev/null
          done
