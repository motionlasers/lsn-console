name: LSN Console Windows

on:
  workflow_dispatch:
    inputs:
      published_release_tag:
        description: Immutable release tag to download and smoke-test
        required: false
        default: ''
  push:
    tags:
      - 'lsn-console-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install Windows platform-native binaries
        shell: bash
        run: |
          # pnpm excludes Windows-only optional deps when the lockfile is built on Linux.
          # Install them from a clean temp dir then copy each package individually,
          # removing any existing pnpm symlink first so cp can write a real directory.
          mkdir -p /tmp/win-bins && cd /tmp/win-bins
          npm init -y
          npm install --no-save --ignore-scripts \
            @rollup/rollup-win32-x64-msvc@4.62.3 \
            @rollup/rollup-win32-x64-gnu@4.62.3 \
            lightningcss-win32-x64-msvc@1.32.0 \
            "@tailwindcss/oxide-win32-x64-msvc@4.3.3" \
            @esbuild/win32-x64@0.27.3
          NM="$GITHUB_WORKSPACE/node_modules"
          mkdir -p "$NM/@rollup" "$NM/@esbuild" "$NM/@tailwindcss"
          for pkg in rollup-win32-x64-msvc rollup-win32-x64-gnu; do
            rm -rf "$NM/@rollup/$pkg"
            cp -rf "node_modules/@rollup/$pkg" "$NM/@rollup/"
          done
          rm -rf "$NM/lightningcss-win32-x64-msvc"
          cp -rf node_modules/lightningcss-win32-x64-msvc "$NM/"
          rm -rf "$NM/@tailwindcss/oxide-win32-x64-msvc"
          cp -rf "node_modules/@tailwindcss/oxide-win32-x64-msvc" "$NM/@tailwindcss/"
          rm -rf "$NM/@esbuild/win32-x64"
          cp -rf "node_modules/@esbuild/win32-x64" "$NM/@esbuild/"
      - run: pnpm --filter @workspace/lsn-engineering-console run lint
      - run: pnpm --filter @workspace/lsn-engineering-console run typecheck
      - run: pnpm --filter @workspace/lsn-engineering-console run test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#lsn-console-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)" >&2
            exit 1
          fi
      - name: Refuse to replace an existing release
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; publish a new version and tag." >&2
            exit 1
          fi
      - run: pnpm --filter @workspace/lsn-engineering-console run build
        env:
          PORT: 4173
          BASE_PATH: ./
      - name: Prepare optional Windows signing certificate
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$WINDOWS_CERTIFICATE_PFX_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            CERT_PATH="$RUNNER_TEMP/lsn-windows-signing.pfx"
            printf '%s' "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode > "$CERT_PATH"
            echo "WINDOWS_CERTIFICATE_FILE=$CERT_PATH" >> "$GITHUB_ENV"
            echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "WINDOWS_SIGNING_MODE=signed" >> "$GITHUB_ENV"
          elif [ -z "$WINDOWS_CERTIFICATE_PFX_BASE64" ] && [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "No signing certificate configured; building an unsigned Development Preview."
            echo "WINDOWS_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
          else
            echo "Both Windows signing secrets must be configured together." >&2
            exit 1
          fi
      - run: pnpm --filter @workspace/lsn-engineering-console run make
      - name: Verify installer Authenticode identity
        shell: pwsh
        run: |
          $version = node -p "require('./artifacts/lsn-engineering-console/package.json').version"
          $installer = Get-ChildItem -Path "artifacts/lsn-engineering-console/out/make" -Recurse `
            -Filter "LSN-Engineering-Console-Setup-$version-dev.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Expected signed installer was not produced."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:WINDOWS_SIGNING_MODE -eq 'signed') {
            if ($signature.Status -ne 'Valid') {
              throw "Installer Authenticode status is $($signature.Status), expected Valid."
            }
            $publisher = $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
            if ($publisher -ne 'Saber Industrial Applications') {
              throw "Unexpected installer publisher: $publisher"
            }
            Write-Host "Verified installer publisher: $publisher"
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_FILE -Force
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "Unsigned build has unexpected Authenticode status $($signature.Status)."
          } else {
            Write-Host "Verified unsigned Development Preview installer."
          }
      - name: Collect and validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          OUT=artifacts/lsn-engineering-console/out/make
          DIST=release-assets
          mkdir -p "$DIST"
          INSTALLER=$(find "$OUT" -name "LSN-Engineering-Console-Setup-${VERSION}-dev.exe" | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "Expected installer LSN-Engineering-Console-Setup-${VERSION}-dev.exe not found" >&2
            find "$OUT" -type f >&2
            exit 1
          fi
          cp "$INSTALLER" "$DIST/"
          PORTABLE=$(find "$OUT" -name "*.zip" | head -n 1)
          if [ -n "$PORTABLE" ]; then
            cp "$PORTABLE" "$DIST/LSN-Engineering-Console-Portable-${VERSION}.zip"
          else
            echo "Expected portable ZIP was not produced." >&2
            find "$OUT" -type f >&2
            exit 1
          fi
          (cd "$DIST" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Install and smoke-test Windows application
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./artifacts/lsn-engineering-console/package.json').version"
          $installer = Get-ChildItem -Path "release-assets" `
            -Filter "LSN-Engineering-Console-Setup-$version-dev.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Expected installer was not collected."
          }

          function Install-Console {
            param([string]$Label)
            $process = Start-Process -FilePath $installer.FullName `
              -ArgumentList '--silent' -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force
              throw "Squirrel installer timed out during $Label."
            }
            if ($process.ExitCode -ne 0) {
              throw "Squirrel installer exited $($process.ExitCode) during $Label."
            }

            $installRoot = Join-Path $env:LOCALAPPDATA 'LSN_Engineering_Console'
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $appExe = Get-ChildItem -Path $installRoot `
                -Filter 'LSN-Engineering-Console.exe' -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -like 'app-*' } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if (-not $appExe) { Start-Sleep -Seconds 2 }
            } while (-not $appExe -and (Get-Date) -lt $deadline)
            if (-not $appExe) {
              throw "Installed Console executable was not found after $Label."
            }
            return $appExe
          }

          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'windows-smoke-evidence'
          $appExe = Install-Console -Label 'first install'
          Get-Process -Name 'LSN-Engineering-Console' -ErrorAction SilentlyContinue |
            Stop-Process -Force
          $env:LSN_WINDOWS_EXECUTABLE = $appExe.FullName
          $env:LSN_WINDOWS_SMOKE_EVIDENCE = $evidenceDir
          $env:LSN_WINDOWS_SMOKE_LABEL = 'first-install'
          node artifacts/lsn-engineering-console/tests/windows/installed-smoke.mjs

          $updateExe = Get-ChildItem -Path $appExe.Directory.Parent.FullName `
            -Filter 'Update.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $updateExe) {
            throw "Squirrel Update.exe was not found for uninstall validation."
          }
          $uninstall = Start-Process -FilePath $updateExe.FullName `
            -ArgumentList '--uninstall', '-s' -PassThru
          if (-not $uninstall.WaitForExit(120000)) {
            Stop-Process -Id $uninstall.Id -Force
            throw 'Squirrel uninstall timed out.'
          }
          if ($uninstall.ExitCode -ne 0) {
            throw "Squirrel uninstall exited $($uninstall.ExitCode)."
          }
          Start-Sleep -Seconds 5

          $appExe = Install-Console -Label 'clean reinstall'
          Get-Process -Name 'LSN-Engineering-Console' -ErrorAction SilentlyContinue |
            Stop-Process -Force
          $env:LSN_WINDOWS_EXECUTABLE = $appExe.FullName
          $env:LSN_WINDOWS_SMOKE_LABEL = 'clean-reinstall'
          node artifacts/lsn-engineering-console/tests/windows/installed-smoke.mjs

          $certificateDir = Join-Path $env:RUNNER_TEMP 'lsn-profile-smoke-cert'
          New-Item -ItemType Directory -Path $certificateDir -Force | Out-Null
          $certificate = Join-Path $certificateDir 'localhost-cert.pem'
          $privateKey = Join-Path $certificateDir 'localhost-key.pem'
          & openssl req -x509 -newkey rsa:2048 -sha256 -nodes `
            -keyout $privateKey -out $certificate -days 1 `
            -subj '/CN=LSN Windows Profile Smoke' `
            -addext 'subjectAltName=DNS:localhost'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to generate profile smoke HTTPS certificate.'
          }
          $trustedCertificate = Import-Certificate `
            -FilePath $certificate `
            -CertStoreLocation 'Cert:\CurrentUser\Root'
          if (-not $trustedCertificate) {
            throw 'Unable to trust profile smoke HTTPS certificate.'
          }
          try {
            $env:LSN_WINDOWS_SMOKE_CERT = $certificate
            $env:LSN_WINDOWS_SMOKE_KEY = $privateKey
            node artifacts/lsn-engineering-console/tests/windows/profile-update-smoke.mjs
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed profile-only publication smoke failed.'
            }
          } finally {
            Remove-Item `
              -LiteralPath "Cert:\CurrentUser\Root\$($trustedCertificate.Thumbprint)" `
              -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificateDir -Recurse -Force
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LSN-Engineering-Console-Windows-Smoke-Evidence
          path: windows-smoke-evidence/**
          if-no-files-found: warn
      - name: Write release notes for signing mode
        shell: bash
        run: |
          if [ "$WINDOWS_SIGNING_MODE" = "signed" ]; then
            SECURITY_NOTE="The installer is Authenticode-signed by Saber Industrial Applications."
          else
            SECURITY_NOTE="The installer is unsigned. Windows SmartScreen will warn on first run; choose More info, then Run anyway."
          fi
          cat > windows-release-notes.md <<EOF
          Development Preview build of the LSN Engineering Console.

          - ${SECURITY_NOTE}
          - Packaged Windows Hardware Mode includes guarded EtherNet/IP discovery/session support; unresolved profile identity and mappings keep telemetry/control fail-closed, physical validation is still required, and firmware upload is not yet implemented.
          - LSN Protocol, Device Profile, and the LSN-Firmware-Interface-v0.1 package are unchanged (v0.1).

          See artifacts/lsn-engineering-console/CHANGELOG.md for the full release entry.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: LSN-Engineering-Console-Windows
          path: release-assets/**
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite_files: false
          name: LSN Engineering Console ${{ github.ref_name }} (Development Preview)
          body_path: windows-release-notes.md
      - name: Verify permanent release asset URLs
        if: startsWith(github.ref, 'refs/tags/lsn-console-v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./artifacts/lsn-engineering-console/package.json').version")
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          for ASSET in \
            "LSN-Engineering-Console-Setup-${VERSION}-dev.exe" \
            "LSN-Engineering-Console-Portable-${VERSION}.zip" \
            "SHA256SUMS.txt"; do
            URL="${RELEASE_BASE}/${ASSET}"
            echo "Verifying ${URL}"
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-delay 3 --retry-all-errors "${URL}" >/dev/null
          done

  smoke-published-release:
    if: github.event_name == 'workflow_dispatch' && inputs.published_release_tag != ''
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Download and verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.published_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p published-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'LSN-Engineering-Console-Setup-*-dev.exe' \
            --pattern 'SHA256SUMS.txt' \
            --dir published-release
          cd published-release
          grep 'LSN-Engineering-Console-Setup-' SHA256SUMS.txt > INSTALLER-SHA256.txt
          sha256sum --check INSTALLER-SHA256.txt

          if [ "$RELEASE_TAG" = "lsn-console-v0.2.1" ]; then
            EXPECTED_COMMIT="b0707fafa100d8df6a8b56f5a454e2a070955bda"
            EXPECTED_INSTALLER="LSN-Engineering-Console-Setup-0.2.1-dev.exe"
            EXPECTED_INSTALLER_SHA="8f683e27a138bfe3f0a9199a45cf424304e7ed96e477ff388bdb08eacf0f68fd"
            EXPECTED_MANIFEST_SHA="91f245548d8fb155590a4dcf056ecb83e076f8198da17178a5894bc68bec66ec"

            git -C "$GITHUB_WORKSPACE" fetch --force --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            ACTUAL_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-list -n 1 "$RELEASE_TAG")
            test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
            printf '%s *%s\n' "$EXPECTED_INSTALLER_SHA" "$EXPECTED_INSTALLER" |
              sha256sum --check -
            printf '%s *SHA256SUMS.txt\n' "$EXPECTED_MANIFEST_SHA" |
              sha256sum --check -
          fi
      - name: Install and smoke-test published release
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'published-release' `
            -Filter 'LSN-Engineering-Console-Setup-*-dev.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Published installer was not downloaded.'
          }

          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList '--silent' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Published Squirrel installer timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Published Squirrel installer exited $($process.ExitCode)."
          }

          $installRoot = Join-Path $env:LOCALAPPDATA 'LSN_Engineering_Console'
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $appExe = Get-ChildItem -Path $installRoot `
              -Filter 'LSN-Engineering-Console.exe' -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -like 'app-*' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $appExe) { Start-Sleep -Seconds 2 }
          } while (-not $appExe -and (Get-Date) -lt $deadline)
          if (-not $appExe) {
            throw 'Published Console executable was not found after installation.'
          }

          Get-Process -Name 'LSN-Engineering-Console' -ErrorAction SilentlyContinue |
            Stop-Process -Force
          $env:LSN_WINDOWS_EXECUTABLE = $appExe.FullName
          $env:LSN_WINDOWS_SMOKE_EVIDENCE = Join-Path `
            $env:GITHUB_WORKSPACE 'published-release-smoke-evidence'
          $env:LSN_WINDOWS_SMOKE_LABEL = 'published-release'
          $env:LSN_WINDOWS_EXPECT_PHYSICAL_TRANSPORT = 'false'
          $env:LSN_WINDOWS_EXPECT_UPDATER = 'false'
          node artifacts/lsn-engineering-console/tests/windows/installed-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LSN-Engineering-Console-Published-Release-Smoke-Evidence
          path: published-release-smoke-evidence/**
          if-no-files-found: warn
